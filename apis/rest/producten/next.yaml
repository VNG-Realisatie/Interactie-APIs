openapi: 3.1.0
info:
  title: MijnProducten
  description: |
    De **MijnProducten API** standaardiseert hoe portalen producten van een inwoner of
    ondernemer **tonen**. Een product is bijvoorbeeld een parkeervergunning, een
    containervergunning of een bezoekersregeling.

    Dit is een **inkijk-contract**: portalen raadplegen producten, ze muteren ze niet.
    Aanvragen, verlengen en verbruiken (bijv. een strip afschrijven van een
    bezoekersregeling) gebeuren bij de bron en vallen buiten dit contract.

    Begrippen en veldnamen sluiten aan op [Open Product](https://github.com/maykinmedia/open-product)
    — `producttype`, `dataobject`, `verbruiksobject`, `uniformeProductNaam` en de
    statuswaarden — zodat een provider die Open Product gebruikt eenvoudig kan mappen.
    Veldnamen volgen `camelCase` (conform de overige MijnServices-API's in deze repo);
    dat is de enige bewuste afwijking van Open Product, dat `snake_case` hanteert.

    Identificatie en authenticatie van eindgebruikers vallen buiten de scope; die worden
    afgehandeld door een externe identity provider (zoals DigiD of eHerkenning).

    ## Principes

    ### 1. Uniform contract

    Alle providers implementeren dezelfde interface: dezelfde endpoints, dezelfde
    responsestructuur, hetzelfde gedrag. Het maakt voor een portaal niet uit hoe de
    provider intern is georganiseerd of waar de data vandaan komt.

    ### 2. Forward en backward compatibility

    Portalen en providers moeten onafhankelijk van elkaar kunnen evolueren. Het contract
    is daarom uitbreidbaar zonder bestaande implementaties te breken. Dit volgt het
    [Robustness principle](https://en.wikipedia.org/wiki/Robustness_principle): wees
    conservatief in wat je stuurt, liberaal in wat je accepteert.

    ### 3. Vaste kern, variabele schil

    Elk product heeft een **vaste kern** van attributen die voor alle producttypen
    gelijk is: `naam`, `startDatum`, `eindDatum`, `status`. Een portaal kan elk product
    op een uniforme manier in een overzicht tonen zonder het producttype te kennen.

    Daarnaast heeft een product een **variabel deel**: `dataobject` — een JSON-object
    waarvan de structuur per `ProductType` verschilt (bijv. kenteken bij een
    parkeervergunning, afmetingen bij een containervergunning). Die structuur wordt
    beschreven door een **JSON Schema** op het producttype (`dataobjectSchema`). Het
    portaal haalt het producttype op om de variabele attributen te labelen en te tonen,
    en kan zo een generieke weergave bouwen voor elk (ook toekomstig) producttype.
    Hetzelfde geldt voor `verbruiksobject` en `verbruiksobjectSchema`.

    ### 4. Privacy by design

    Producten van een klant worden opgevraagd via `POST /producten/zoek`, zodat
    `klantId` in de request body staat en niet in URL's, querystrings, browserhistory of
    access logs lekt. Dit wijkt bewust af van Open Product (dat met een querystring
    filtert): MijnProducten is een portaal-facing contract waarin identificerende
    gegevens niet in de URL horen.
