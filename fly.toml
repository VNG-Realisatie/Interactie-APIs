# fly.toml app configuration file generated for vng-interactie-mocks on 2026-04-23T11:39:48+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vng-interactie-mocks'
primary_region = 'ams'

[env]
  MOCK_GATEWAY_PORT = '4010'
  # Fly: alleen actieve next-specs — 17 parallelle Prism-processen past niet op 1 GB.
  MOCK_SPEC_GLOB = 'apis/**/next.yaml'
  MOCK_READY_TIMEOUT_MS = '120000'

[build]

[http_service]
  internal_port = 4010
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "45s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  count = 1
